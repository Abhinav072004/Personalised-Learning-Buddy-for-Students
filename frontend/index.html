<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning Buddy</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">LB</span> Learning Buddy</div>
  <div class="who">
    <select id="studentSelect" aria-label="Student profile"></select>
    <button class="btn ghost" id="newStudentBtn">+ New student</button>
    <a class="btn ghost" href="/admin">Admin</a>
  </div>
</header>

<div class="layout">
  <nav class="tabs" id="tabs">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="plan">Plan</button>
    <button data-tab="learn">Learn &amp; practise</button>
    <button data-tab="assess">Assess</button>
    <button data-tab="adapt">Adapt</button>
    <button data-tab="history">History</button>
    <button data-tab="chat" class="chat-tab">Chat</button>
  </nav>

  <main id="main">
    <section id="tab-overview" class="tab active"></section>
    <section id="tab-plan" class="tab"></section>
    <section id="tab-learn" class="tab"></section>
    <section id="tab-assess" class="tab"></section>
    <section id="tab-adapt" class="tab"></section>
    <section id="tab-history" class="tab"></section>
  </main>

  <aside id="chat" class="chat">
    <div class="chat-head">
      <strong>Ask your buddy</strong>
      <span class="muted small" id="chatMode"></span>
      <button class="btn ghost small" id="newSessionBtn" title="Start a new session (long-term memory is kept)">New session</button>
    </div>
    <div class="chat-log" id="chatLog" aria-live="polite"></div>
    <div class="chips" id="chatChips"></div>
    <form id="chatForm" class="chat-form">
      <input id="chatInput" autocomplete="off" placeholder="Ask anything about your plan..." maxlength="2000">
      <button class="btn" type="submit">Send</button>
    </form>
  </aside>
</div>

<dialog id="onboard">
  <form method="dialog" id="onboardForm" class="onboard">
    <h2>Welcome! Let's set up your buddy</h2>
    <p class="muted">Tell us where you stand and where you want to go. Self-ratings are treated as weak evidence until a short quiz confirms them.</p>
    <div class="grid2">
      <label>Name<input name="name" required maxlength="120"></label>
      <label>Programme<select name="programme" id="obProgramme"></select></label>
      <label>Year<select name="year"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
      <label>CGPA<input name="cgpa" type="number" step="0.01" min="0" max="10" value="7.5" required></label>
    </div>
    <label>What do you want to do after college? (in your own words)
      <input name="goal_text" id="obGoalText" placeholder="e.g. a software job, MS abroad, UPSC, my own startup...">
    </label>
    <div id="obGoalMatch" class="small muted"></div>
    <label>Or pick a goal<select name="goal_id" id="obGoal"><option value="">- not sure yet -</option></select></label>
    <div class="grid2">
      <label>Hours per week outside classes<input name="hours" type="number" min="1" max="60" value="8"></label>
      <label>Max credits next semester (optional)<input name="max_credits" type="number" min="12" max="30"></label>
      <label>Interests (comma separated)<input name="interests" placeholder="machine learning, web"></label>
      <label>Pace<select name="pace"><option value="slow">Slow &amp; thorough</option><option value="steady" selected>Steady</option><option value="fast">Fast</option></select></label>
    </div>
    <fieldset><legend>I learn best with</legend>
      <label class="inline"><input type="checkbox" name="fmt" value="video" checked> Short videos</label>
      <label class="inline"><input type="checkbox" name="fmt" value="text"> Reading</label>
      <label class="inline"><input type="checkbox" name="fmt" value="practice" checked> Hands-on problems</label>
    </fieldset>
    <fieldset><legend>Rate yourself (optional, 0-100)</legend><div id="obRatings" class="grid3"></div></fieldset>
    <menu>
      <button value="cancel" class="btn ghost" formnovalidate>Cancel</button>
      <button value="ok" class="btn" id="obSubmit">Create my plan</button>
    </menu>
  </form>
</dialog>

<div id="toast" class="toast" role="status"></div>
<script src="/static/app.js"></script>
</body>
</html>
